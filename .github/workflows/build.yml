name: Build NP2 Kernel (arter97)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475.git'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        description: 'Defconfig'
        required: false
        type: string
        default: 'defconfig'
      extra_configs:
        description: 'Extra config fragments'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      kernel_repo:
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475.git'
      kernel_branch:
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        required: false
        type: string
        default: 'defconfig'
      extra_configs:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      MAKE_ARGS: >-
        ARCH=arm64
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        LLVM=1 LLVM_IAS=1
        LD=ld.lld HOSTLD=ld.lld
        CC=clang CXX=clang++
        HOSTCC=clang HOSTCXX=clang++
        LLVM_AR=llvm-ar
        LLVM_NM=llvm-nm
        LLVM_OBJDUMP=llvm-objdump
        AR=llvm-ar
        NM=llvm-nm
        OBJCOPY=llvm-objcopy
        STRIP=llvm-strip
        O=out

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            lz4 zip python3 clang llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi perl

      - name: Clone sources
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          git clone --depth=1 -b gki-android13-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git

      - name: Fix LLVM paths
        run: |
          cd kernel

          echo "Removing hardcoded arter97 LLVM paths..."

          grep -rl "/home/arter97" . | while read f; do
            sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/||g' "$f" || true
          done

          find . -type f | xargs sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/llvm-ar|llvm-ar|g'
          find . -type f | xargs sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/llvm-nm|llvm-nm|g'
          find . -type f | xargs sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/ld.lld|ld.lld|g'
          find . -type f | xargs sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/clang|clang|g'

          echo "Verifying cleanup..."
          grep -R "/home/arter97" . || true

      - name: Setup SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash

      - name: Apply patches
        run: |
          cd kernel

          echo "Applying avc patch..."
          patch -p1 < ../patches/avc_patch.diff || echo "avc patch failed"

          echo "Applying SUSFS patch..."
          patch -p1 -N < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch || true

          echo "Applying fix_api patch..."
          patch -p1 < ../patches/fix_api.diff || echo "fix_api patch failed"

          echo "Resetting tree..."
          git reset --hard
          git clean -fd

          echo "Resetting vmalloc.c..."
          git checkout -- mm/vmalloc.c

          echo "Checking original vmalloc state..."
          grep -n "huge_ptep_get_and_clear" mm/vmalloc.c || true

          echo "Applying vmalloc compatibility fix..."
          perl -0pi -e 's/huge_ptep_get_and_clear\s*\(\s*&init_mm\s*,\s*addr\s*,\s*pte\s*,\s*size\s*\)/huge_ptep_get_and_clear\(&init_mm, addr, pte\)/g' mm/vmalloc.c

          echo "Verifying vmalloc fix..."
          grep -n "huge_ptep_get_and_clear" mm/vmalloc.c || true

          echo "Applying vmalloc fix..."
          perl -0pi -e 's/ptent = .*?huge_ptep_get_and_clear.*?;/ptent = huge_ptep_get_and_clear\(&init_mm, addr, pte\);/s' mm/vmalloc.c

          echo "Verifying vmalloc fix..."
          grep -n "huge_ptep_get_and_clear" mm/vmalloc.c || true

          echo "Removing stale map_kernel_range export..."
          sed -i '/EXPORT_SYMBOL_GPL(map_kernel_range)/d' mm/vmalloc.c
          sed -i '/EXPORT_SYMBOL(map_kernel_range)/d' mm/vmalloc.c

          echo "Verifying map_kernel_range removal..."
          grep -n "map_kernel_range" mm/vmalloc.c || true

          echo "Fixing page_io.c NODE_DATA(nid) scope issue..."
          # SUSFS patch adds NODE_DATA(nid) but this vendor tree's function
          # doesn't declare 'nid'. Inject 'int nid = page_to_nid(page);'
          # immediately before the first NODE_DATA(nid) usage if not already present.
          if grep -q "NODE_DATA(nid)" mm/page_io.c && ! grep -q "page_to_nid" mm/page_io.c; then
            perl -0pi -e 's/(pg_data_t \*pgdat = NODE_DATA\(nid\);)/int nid = page_to_nid(page);\n\t\t$1/g' mm/page_io.c
          fi

          echo "Verifying page_io.c fix..."
          grep -n "nid\|NODE_DATA\|page_to_nid" mm/page_io.c || true

      - name: Configure kernel
        run: |
          cd kernel

          DEFCONFIG="${{ inputs.kernel_defconfig }}"
          make $MAKE_ARGS $DEFCONFIG

          KCFG="./scripts/config --file out/.config"

          $KCFG -e KSU
          $KCFG -e KSU_SUSFS
          $KCFG -e KPM

          make $MAKE_ARGS olddefconfig

          [ -f scripts/setlocalversion ] && sed -i 's/-dirty//g' scripts/setlocalversion || true

      - name: Enable swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build kernel (debug mode)
        run: |
          cd kernel
          make -j1 $MAKE_ARGS KCFLAGS="-Wno-error" V=1

      - name: Package AnyKernel3
        run: |
          if [ ! -f kernel/out/arch/arm64/boot/Image ]; then
            echo "ERROR: kernel Image not found"
            exit 1
          fi

          cp kernel/out/arch/arm64/boot/Image* AnyKernel3/ 2>/dev/null || true

          cp Scripts/anykernel.sh AnyKernel3/anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=NP2 Kernel - SukiSU/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "../SukiSU-NP2-Pong.zip" ./*

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-NP2-SukiSU
          path: "*.zip"

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: kernel/out/.config

      - name: Upload rejects
        if: always()
        run: |
          mkdir -p rej
          find . -name '*.rej' -exec cp --parents {} rej/ \; || true