name: Build NP2 Kernel (arter97)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        description: 'Defconfig (use /name for kernel root, otherwise arch/arm64/configs/name)'
        required: false
        type: string
        default: '/defconfig'
      kpm_support:
        description: 'Enable KPM support'
        required: false
        type: boolean
        default: true
      susfs_support:
        description: 'Enable SUSFS support'
        required: false
        type: boolean
        default: true
      susfs_branch:
        description: 'SUSFS branch'
        required: false
        type: string
        default: 'gki-android13-5.10'
      susfs_force:
        description: 'Force SUSFS patch apply (ignore failures)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      kernel_repo:
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475'
      kernel_branch:
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        required: false
        type: string
        default: '/defconfig'
      kpm_support:
        required: false
        type: boolean
        default: true
      susfs_support:
        required: false
        type: boolean
        default: true
      susfs_branch:
        required: false
        type: string
        default: 'gki-android13-5.10'
      susfs_force:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KERNEL_DIR: kernel
      ANYKERNEL_DIR: AnyKernel3
      DEFCONFIG: ${{ inputs.kernel_defconfig }}
      MAKE_ARGS: >-
        ARCH=arm64
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        LLVM=1 LLVM_IAS=1
        LD=ld.lld HOSTLD=ld.lld
        CC=clang CXX=clang++
        HOSTCC=clang HOSTCXX=clang++
        O=out

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev ccache \
            lz4 zip python3 clang llvm lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi wget perl

      # arter97's kernel has hardcoded absolute LLVM paths to his local machine.
      # Create symlinks at those exact paths pointing to system tools so the
      # kernel's Makefile resolves them without any source file modifications.
      - name: Setup LLVM symlinks for arter97 hardcoded paths
        run: |
          llvm_dir=/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin
          sudo mkdir -p "$llvm_dir"
          for tool in clang clang++ llvm-ar llvm-nm llvm-objdump llvm-objcopy \
                      llvm-readelf llvm-strip ld.lld llvm-ranlib; do
            src=$(command -v "$tool" || true)
            if [ -n "$src" ]; then
              sudo ln -sf "$src" "$llvm_dir/$tool"
              echo "Linked: $llvm_dir/$tool -> $src"
            else
              echo "WARNING: $tool not found in PATH"
            fi
          done

      - name: Clone sources
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" "$KERNEL_DIR"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$ANYKERNEL_DIR"
          rm -rf "$ANYKERNEL_DIR/.git"

      - name: Clone SUSFS
        if: ${{ inputs.susfs_support == true }}
        run: |
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git

      - name: Setup SukiSU Ultra
        run: |
          cd "$KERNEL_DIR"
          echo "Fetching SukiSU Ultra setup script..."
          curl -v -L --retry 3             "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"             -o /tmp/sukisu_setup.sh
          echo "Exit code: $?"
          ls -la /tmp/sukisu_setup.sh || echo "File not found after curl"
          echo "--- setup.sh lines 395-415 (debug) ---"
          sed -n '395,415p' /tmp/sukisu_setup.sh || true
          echo "--- running setup.sh ---"
          bash /tmp/sukisu_setup.sh

      - name: Apply extra patches (arter97-specific)
        run: |
          cd "$KERNEL_DIR"

          # Fix KernelSU selinux/rules.c API mismatch with this vendor 5.10 tree.
          # SukiSU setup.sh drops drivers/kernelsu/ into the tree; its rules.c
          # references selinux_state.avc, avc_ss_reset(avc, seqno), and
          # selinux_status_update_policyload(&state, seqno) — all newer-kernel API
          # that doesn't exist in arter97's tree. Patch to the older signatures.
          rules="drivers/kernelsu/selinux/rules.c"
          if [ -f "$rules" ]; then
            echo "Patching $rules for 5.10 SELinux API compat..."
            # Remove the 'struct selinux_avc *avc = selinux_state.avc;' line
            sed -i '/struct selinux_avc \*avc = selinux_state\.avc;/d' "$rules"
            
            # Patch the extern declaration to expect only 1 argument (seqno)
            sed -i 's/extern int avc_ss_reset(struct selinux_avc \*avc, u32 seqno);/extern int avc_ss_reset(u32 seqno);/g' "$rules"
            
            # avc_ss_reset(avc, 0) -> avc_ss_reset(0)
            sed -i 's/avc_ss_reset(avc, 0)/avc_ss_reset(0)/g' "$rules"
            # selinux_status_update_policyload(&selinux_state, 0) -> selinux_status_update_policyload(0)
            sed -i 's/selinux_status_update_policyload(&selinux_state, 0)/selinux_status_update_policyload(0)/g' "$rules"
            
            echo "Verifying rules.c fix..."
            grep -n "avc_ss_reset\|selinux_status_update_policyload\|selinux_state\.avc" "$rules" || true
          else
            echo "WARNING: $rules not found — SukiSU setup may have failed"
          fi

          # Apply any additional patch files from patches/arter97/
          patch_dir="$GITHUB_WORKSPACE/patches/arter97"
          if [ -d "$patch_dir" ]; then
            while IFS= read -r -d '' patch; do
              echo "Applying $patch"
              patch -p1 < "$patch" || echo "Patch failed (non-fatal): $patch"
            done < <(find "$patch_dir" -maxdepth 1 -type f \( -name '*.patch' -o -name '*.diff' \) -print0 | sort -z)
          else
            echo "No patches/arter97 dir found, skipping"
          fi

      - name: Apply SUSFS patches
        if: ${{ inputs.susfs_support == true }}
        run: |
          cd "$KERNEL_DIR"
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          susfs_patch="../susfs4ksu/kernel_patches/50_add_susfs_in_${{ inputs.susfs_branch }}.patch"
          if [ "${{ inputs.susfs_force }}" = "true" ]; then
            patch -p1 --force < "$susfs_patch" || echo "Continuing despite patch failure"
          else
            patch -p1 < "$susfs_patch" || echo "SUSFS patch had failures, check .rej files"
          fi

      - name: Enable swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if sudo fallocate -l 12G /swapfile; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || echo "Swap not permitted on this runner"
          else
            echo "Swap file allocation failed; continuing without swap"
          fi

      - name: Configure kernel
        run: |
          cd "$KERNEL_DIR"

          # Resolve defconfig path (leading / means kernel root, else arch/arm64/configs/)
          def="${{ inputs.kernel_defconfig }}"
          if echo "$def" | grep -q '^/'; then
            def_path="${def#/}"
          else
            def_path="arch/arm64/configs/$def"
          fi

          if [ ! -f "$def_path" ]; then
            echo "Defconfig not found: $def_path" >&2
            exit 1
          fi

          def_target="$(basename "$def_path")"
          # Copy to arch/arm64/configs if it lives elsewhere (e.g. kernel root)
          if [ "$def_path" != "arch/arm64/configs/$def_target" ]; then
            cp "$def_path" "arch/arm64/configs/$def_target"
          fi

          make $MAKE_ARGS "$def_target"

          # Write extra Kconfig options
          EXTRA_CFG="out/ci-extra.config"
          : > "$EXTRA_CFG"
          echo "CONFIG_KSU=y" >> "$EXTRA_CFG"

          if [ "${{ inputs.susfs_support }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$EXTRA_CFG"
          fi

          if [ "${{ inputs.kpm_support }}" = "true" ]; then
            echo "CONFIG_KPM=y"         >> "$EXTRA_CFG"
            echo "CONFIG_KALLSYMS=y"    >> "$EXTRA_CFG"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$EXTRA_CFG"
            echo "CONFIG_KPROBES=y"     >> "$EXTRA_CFG"
          fi

          cat "$EXTRA_CFG" >> out/.config
          make $MAKE_ARGS olddefconfig

          [ -f scripts/setlocalversion ] && sed -i 's/-dirty//g' scripts/setlocalversion || true

      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"
          JOBS=$(( $(nproc) / 2 ))
          [ "$JOBS" -lt 1 ] && JOBS=1
          make -j"$JOBS" $MAKE_ARGS Image KCFLAGS="-Wno-error"

      - name: Apply KPM patch
        if: ${{ inputs.kpm_support == true }}
        run: |
          cd "$KERNEL_DIR/out/arch/arm64/boot"
          python3 - <<'PY'
          import json, sys, urllib.request
          url = "https://api.github.com/repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest"
          with urllib.request.urlopen(url) as resp:
            data = json.load(resp)
          assets = data.get("assets", [])
          match = next((a["browser_download_url"] for a in assets if "patch_linux" in a.get("name", "")), None)
          if not match:
            print("ERROR: patch_linux asset not found", file=sys.stderr)
            sys.exit(1)
          urllib.request.urlretrieve(match, "patch_linux")
          PY
          chmod +x ./patch_linux
          ./patch_linux
          rm -f ./Image
          mv ./oImage ./Image

      - name: Package AnyKernel3
        run: |
          if [ ! -f "$KERNEL_DIR/out/arch/arm64/boot/Image" ]; then
            echo "ERROR: kernel Image not found"
            exit 1
          fi

          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" "$ANYKERNEL_DIR/"
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.gz" "$ANYKERNEL_DIR/" 2>/dev/null || true

          # Write anykernel.sh directly — no Scripts/ dir dependency
          cat > "$ANYKERNEL_DIR/anykernel.sh" <<'AKSH'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=NP2 Kernel - SukiSU (arter97)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Pong
          device.name2=pong
          supported.versions=13-16
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKSH

          cd "$ANYKERNEL_DIR"
          zip -r9 "../kernel-arter97-NP2-SukiSU.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arter97-NP2-SukiSU
          path: "kernel-arter97-NP2-SukiSU.zip"
          retention-days: 30

      - name: Upload .config for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-arter97-NP2-SukiSU
          path: kernel/out/.config
          retention-days: 1

      - name: Collect and upload .rej files
        if: always()
        id: collect_rej
        run: |
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' f; do
            found="true"
            mkdir -p "rej/$(dirname "$f")"
            cp "$f" "rej/$f"
            orig="${f%.rej}"
            [ -f "$orig" ] && cp "$orig" "rej/$orig"
          done < <(find . -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Upload .rej files
        if: always() && steps.collect_rej.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rej-arter97-NP2-SukiSU
          path: rej/