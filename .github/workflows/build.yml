name: Build NP2 Kernel (arter97)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475.git'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        description: 'Defconfig'
        required: false
        type: string
        default: 'defconfig'
      extra_configs:
        description: 'Extra config fragments'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      kernel_repo:
        required: false
        type: string
        default: 'https://github.com/arter97/android_kernel_nothing_sm8475.git'
      kernel_branch:
        required: false
        type: string
        default: 'master'
      kernel_defconfig:
        required: false
        type: string
        default: 'defconfig'
      extra_configs:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      MAKE_ARGS: >-
        ARCH=arm64
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        LLVM=1 LLVM_IAS=1
        LD=ld.lld HOSTLD=ld.lld
        CC=clang CXX=clang++
        HOSTCC=clang HOSTCXX=clang++
        LLVM_AR=llvm-ar
        LLVM_NM=llvm-nm
        LLVM_OBJDUMP=llvm-objdump
        O=out

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            lz4 zip python3 clang llvm lld \
            llvm-strip llvm-objcopy \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone sources
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          git clone --depth=1 -b gki-android13-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git

      - name: Fix LLVM paths
        run: |
          cd kernel
          grep -rl "/home/arter97" . | xargs -r sed -i 's|/home/arter97/android/nathan/llvm-22.1.0-x86_64/bin/||g'

      - name: Setup SukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash

      - name: Apply patches
        run: |
          cd kernel

          echo "Applying avc patch..."
          patch -p1 < ../patches/avc_patch.diff || echo "avc patch failed"

          echo "Applying SUSFS patch..."
          patch -p1 -N < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch || true

          echo "Applying fix_api patch..."
          patch -p1 < ../patches/fix_api.diff || echo "fix_api patch failed"

      - name: Configure kernel
        run: |
          cd kernel

          DEFCONFIG="${{ inputs.kernel_defconfig }}"
          make $MAKE_ARGS $DEFCONFIG

          KCFG="./scripts/config --file out/.config"

          $KCFG -e KSU
          $KCFG -e KSU_SUSFS
          $KCFG -e KPM

          make $MAKE_ARGS olddefconfig

          [ -f scripts/setlocalversion ] && sed -i 's/-dirty//g' scripts/setlocalversion || true

      - name: Enable swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build kernel
        run: |
          cd kernel
          JOBS=$(( $(nproc) / 2 ))
          [ "$JOBS" -lt 1 ] && JOBS=1

          make -j$JOBS $MAKE_ARGS KCFLAGS="-Wno-error" V=1

      - name: Package AnyKernel3
        run: |
          if [ ! -f kernel/out/arch/arm64/boot/Image ]; then
            echo "ERROR: kernel Image not found"
            exit 1
          fi

          cp kernel/out/arch/arm64/boot/Image* AnyKernel3/ 2>/dev/null || true

          cp Scripts/anykernel.sh AnyKernel3/anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=NP2 Kernel - SukiSU/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "../SukiSU-NP2-Pong.zip" ./*

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-NP2-SukiSU
          path: "*.zip"

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: kernel/out/.config

      - name: Upload rejects
        if: always()
        run: |
          mkdir -p rej
          find . -name '*.rej' -exec cp --parents {} rej/ \; || true